name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Create NaverApiKeys.kt
        run: |
          mkdir -p app/src/main/java/com/g1/booklog/data/network
          cat > app/src/main/java/com/g1/booklog/data/network/NaverApiKeys.kt << 'EOF'
          package com.g1.booklog.data.network

          object NaverApiKeys {
              const val CLIENT_ID = "${{ secrets.NAVER_CLIENT_ID }}"
              const val CLIENT_SECRET = "${{ secrets.NAVER_CLIENT_SECRET }}"
          }
          EOF

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/G1-booklog-release.apk
          name: "BOOKLOG ${{ github.ref_name }}"
          body: "Release ${{ github.ref_name }}"
